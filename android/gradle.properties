org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# AGP 9 ships a new DSL and its own bundled Kotlin support behind these flags.
# Stay on the stable DSL and the standalone Kotlin plugins for now.
android.newDsl=false
android.builtInKotlin=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
