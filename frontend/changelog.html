<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changelog - listen-along</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/vendor/bootstrap-6.0.0-alpha.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <nav class="navbar app-navbar">
    <div class="container app-narrow">
      <a href="/" class="btn-text theme-secondary btn-sm">&larr; Back</a>
      <h1 class="h6 mb-0 me-auto">Changelog</h1>
      <button type="button" class="btn-text theme-secondary btn-icon" data-theme-toggle aria-label="Toggle colour mode"></button>
    </div>
  </nav>
  <main class="container app-narrow py-6">
    <div id="changelog-content" class="vstack gap-4">Loading...</div>
  </main>
  <script>
    fetch('/api/changelog')
      .then(r => r.json())
      .then(data => {
        const el = document.getElementById('changelog-content');
        if (!data.changelog) { el.textContent = 'No changelog available.'; return; }
        // Simple markdown-to-html for changelog format
        let html = '';
        for (const line of data.changelog.split('\n')) {
          if (line.startsWith('## ')) {
            html += `${html ? '</ul></section>' : ''}<section class="card"><h2 class="card-header h6 mb-0">${line.slice(3)}</h2><ul class="list-group list-group-flush">`;
          } else if (line.startsWith('- ')) {
            let text = line.slice(2);
            if (text.startsWith('feat:')) text = `<span class="badge badge-subtle theme-primary me-1">feat</span>${text.slice(5)}`;
            else if (text.startsWith('fix:')) text = `<span class="badge badge-subtle theme-warning me-1">fix</span>${text.slice(4)}`;
            html += `<li class="list-group-item fs-sm">${text}</li>`;
          }
        }
        if (html) html += '</ul></section>';
        el.innerHTML = html;
      })
      .catch(() => {
        document.getElementById('changelog-content').textContent = 'Failed to load changelog.';
      });
  </script>
</body>
</html>
