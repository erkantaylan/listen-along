services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Optional: set GIT_COMMIT in Dokploy; else read from the context's .git
        - GIT_COMMIT=${GIT_COMMIT:-}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://listen:listen@postgres:5432/listen
      - SONGS_PATH=/data/songs
      - COVERS_DIR=/data/covers
      - SESSION_SECRET=${SESSION_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - BASE_URL=${BASE_URL:-}
      # Central login (OIDC, see CENTRAL-LOGIN.md): the only sign-in. With
      # NODE_ENV=production the server refuses to start unless OIDC_ISSUER,
      # OIDC_CLIENT_ID, BASE_URL (or FRONTEND_URL) and SESSION_SECRET are set. listen-along is a
      # public client: no secret needed. (The dev sign-in, INSECURE_DEV_LOGIN,
      # is deliberately not passed through here; production refuses it anyway.)
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_PROVIDER_MAP=${OIDC_PROVIDER_MAP:-}
      - OIDC_RECHECK_SECONDS=${OIDC_RECHECK_SECONDS:-}
      - OIDC_MAX_UNVERIFIED_SECONDS=${OIDC_MAX_UNVERIFIED_SECONDS:-}
      # open | closed (empty = open): whether central login may create new
      # accounts until an admin saves the switch in /dashboard (then that wins).
      - REGISTRATIONS_DEFAULT=${REGISTRATIONS_DEFAULT:-}
      # The Android app's sign-in redirect (CENTRAL-LOGIN.md, "The redirect"):
      # on | off (empty = on) for the old custom scheme; off once the App Link
      # version is installed. The other two override assetlinks.json's package
      # and release-key fingerprint (empty = the built-in ones).
      - MOBILE_CUSTOM_SCHEME=${MOBILE_CUSTOM_SCHEME:-}
      - ANDROID_APP_PACKAGE=${ANDROID_APP_PACKAGE:-}
      - ANDROID_APP_CERT_SHA256=${ANDROID_APP_CERT_SHA256:-}
      # Login for /dashboard (users, CLI tokens, downloaders, requests, library).
      # ADMIN_USER defaults to "admin". Unset ADMIN_PASSWORD = disabled.
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - songs_data:/data/songs
      - covers_data:/data/covers
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - listen-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listen
      POSTGRES_PASSWORD: listen
      POSTGRES_DB: listen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listen -d listen"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - listen-network

networks:
  listen-network:
    driver: bridge

volumes:
  postgres_data:
  songs_data:
  covers_data:
