services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://listen:listen@postgres:5432/listen
      - SONGS_PATH=/data/songs
      - COVERS_DIR=/data/covers
      - DASHBOARD_USER=${DASHBOARD_USER:-}
      - DASHBOARD_PASS=${DASHBOARD_PASS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - BASE_URL=${BASE_URL:-}
      # web_safari is a PO-token-compatible client; bgutil-provider mints the tokens
      - YTDLP_PLAYER_CLIENT=${YTDLP_PLAYER_CLIENT:-web_safari}
      - YTDLP_POT_BASE_URL=${YTDLP_POT_BASE_URL:-http://bgutil-provider:4416}
      # JS runtime for YouTube signature / n-sig solving (Node is in the image)
      - YTDLP_JS_RUNTIME=${YTDLP_JS_RUNTIME:-node}
    depends_on:
      postgres:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
    volumes:
      - songs_data:/data/songs
      - covers_data:/data/covers
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - listen-network

  # PO Token provider — mints Proof-of-Origin tokens so yt-dlp can get past
  # YouTube's "Sign in to confirm you're not a bot" block on this server's IP.
  # Reached by the app over the internal network at http://bgutil-provider:4416;
  # no published port needed.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    networks:
      - listen-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listen
      POSTGRES_PASSWORD: listen
      POSTGRES_DB: listen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listen -d listen"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - listen-network

networks:
  listen-network:
    driver: bridge

volumes:
  postgres_data:
  songs_data:
  covers_data:
