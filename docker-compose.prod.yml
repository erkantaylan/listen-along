services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Optional: set GIT_COMMIT in Dokploy; else read from the context's .git
        - GIT_COMMIT=${GIT_COMMIT:-}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://listen:listen@postgres:5432/listen
      - SONGS_PATH=/data/songs
      - COVERS_DIR=/data/covers
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - BASE_URL=${BASE_URL:-}
      # Login for /admin (CLI tokens, requests, library) and /dashboard.
      # ADMIN_USER defaults to "admin". Unset ADMIN_PASSWORD = both disabled.
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - songs_data:/data/songs
      - covers_data:/data/covers
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - listen-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listen
      POSTGRES_PASSWORD: listen
      POSTGRES_DB: listen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listen -d listen"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - listen-network

networks:
  listen-network:
    driver: bridge

volumes:
  postgres_data:
  songs_data:
  covers_data:
