name: Backend tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches docker/Dockerfile (node:22-alpine)
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm ci

      # Build the frontend first: tests serve and import frontend/dist.
      - name: Build the frontend
        working-directory: .
        run: npm ci && npm run build

      # The library tests probe/generate real audio; they skip without ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Docker is preinstalled on ubuntu-latest; the testcontainers-based DB
      # tests skip themselves silently without it, so fail loudly instead.
      - name: Check Docker is available
        run: docker info --format '{{.ServerVersion}}'

      # Root `npm test`: the backend suite, then frontend/src tests.
      - run: npm test
        working-directory: .

  # TypeScript: typecheck backend + frontend (tsc -b) and build the frontend.
  # Root package.json holds only typescript and @types/*; no workspaces.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm ci

      # Several backend dependencies ship their own types (socket.io, jose, ...).
      - run: npm ci
        working-directory: backend

      - run: npm run typecheck

      - run: npm run build

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cli/ has no npm dependencies (no lockfile); ffmpeg is for the real-ffmpeg tests.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: npm test
