version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://listen:listen@postgres:5432/listen
      - SONGS_PATH=/data/songs
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - BASE_URL=${BASE_URL:-}
      # Central login (OIDC, see CENTRAL-LOGIN.md). Setting OIDC_ISSUER and
      # OIDC_CLIENT_ID replaces Google / GitHub sign-in; leave both empty for the
      # old login (unsetting them is the rollback). Needs BASE_URL and
      # SESSION_SECRET. listen-along is a public client: no secret needed.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${OIDC_SCOPES:-}
      - OIDC_PROVIDER_MAP=${OIDC_PROVIDER_MAP:-}
      - OIDC_RECHECK_SECONDS=${OIDC_RECHECK_SECONDS:-}
      - OIDC_MAX_UNVERIFIED_SECONDS=${OIDC_MAX_UNVERIFIED_SECONDS:-}
      # open | closed (empty = open): whether central login may create new
      # accounts until an admin saves the switch in /dashboard (then that wins).
      - REGISTRATIONS_DEFAULT=${REGISTRATIONS_DEFAULT:-}
      - ADMIN_USER=${ADMIN_USER:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - songs_data:/data/songs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=listen
      - POSTGRES_PASSWORD=listen
      - POSTGRES_DB=listen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listen"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  songs_data:
